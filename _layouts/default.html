<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fletcher Galeano — resident inventor, operations systems designer, and creator of the Operational Entropy Index.">
  <title>{{ page.title }} · Fletcher Galeano</title>
  <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" type="image/x-icon">
</head>
<body>
  <header class="site-header">
    <a class="site-brand" href="{{ '/' | relative_url }}">Fletcher Galeano</a>
    <span class="site-kicker">Portfolio · Laboratory · Field notebook</span>
    <button id="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">◐</button>
  </header>
  <div class="main-content">
    {% include sidebar.html %}
    <main class="left-aligned-content">{{ content }}</main>
  </div>
  <footer class="site-footer">
    <p>© {{ 'now' | date: '%Y' }} Fletcher Galeano · Built with <a href="https://github.com/fdanilogamu/fdanilogamu.github.io">Git and grit</a> · <a href="mailto:fletcherdgaleano@gmail.com">Email me</a></p>
  </footer>
  <script>
    const toggle = document.getElementById('theme-toggle');
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    toggle.addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });
  </script>
</body>
</html>
